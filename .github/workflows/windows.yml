# Windows판(exe) 빌드
# - 태그(v3.8 같은)를 올리면: Windows용 ZIP을 빌드해서 그 태그의 Release에 자동으로 붙입니다.
# - Actions 탭에서 직접 실행하면: 빌드만 하고, 결과 ZIP을 실행 기록의 Artifacts에서 받을 수 있습니다.
# 서명 키 같은 비밀 정보는 쓰지 않습니다.

name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        shell: bash
        run: ./gradlew :desktop:jpackageImage --no-daemon

      - name: Zip
        shell: pwsh
        run: |
          $name = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "build-${{ github.run_number }}" }
          $zip = "AugmentPD-$name-windows.zip"
          Compress-Archive -Path desktop/build/jpackage/AugmentPD -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: AugmentPD-windows
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
